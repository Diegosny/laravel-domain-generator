name: Security • CodeQL

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  schedule:
    - cron: "30 1 * * 0"

jobs:
  analyse:
    permissions:
      security-events: write
      contents: read

    uses: github/codeql-action/.github/workflows/codeql.yml@v3
    with:
      languages: php